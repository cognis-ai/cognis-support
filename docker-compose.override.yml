# Local dev override — avoid colliding with the other Cognis stacks already running
# (voice/security Postgres+Redis on 5432/6379, something on 3000). Internal
# compose-network ports are unchanged; rails still reaches postgres:5432 / redis:6379.
# `!override` / `!reset` REPLACE the base port list instead of merging (Compose v2.20+).
# Not tracked as fork config — purely a local-machine concern.
services:
  postgres:
    ports: !reset []
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
  redis:
    ports: !reset []
  rails:
    ports: !override
      - "3100:3000"
