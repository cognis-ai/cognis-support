name: Upstream rebase

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: cognis/main
          # Prefer a PAT so the resulting PR push triggers downstream CI
          # (GITHUB_TOKEN-driven pushes intentionally don't). Falls back to
          # GITHUB_TOKEN so the bot still works before a PAT is configured.
          token: ${{ secrets.REBASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "cognis-rebase-bot"
          git config user.email "bot@cognisai.com"
          git config rerere.enabled true
          git config rerere.autoUpdate true

      - name: Restore rerere cache
        run: |
          mkdir -p .git/rr-cache
          if [ -d infra/rerere-cache ]; then
            cp -R infra/rerere-cache/. .git/rr-cache/
          fi

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/chatwoot/chatwoot
          git fetch upstream develop

      - name: Update vendor/upstream branch
        run: |
          git checkout -B vendor/upstream upstream/develop
          git push origin vendor/upstream --force

      - name: Try rebase (auto-resolves enterprise/ modify-delete)
        id: rebase
        shell: bash
        run: |
          set +e
          set +o pipefail

          git checkout -B rebase-staging cognis/main
          git rebase vendor/upstream
          REBASE_RC=$?
          if [ $REBASE_RC -eq 0 ]; then
            echo "[ok] rebase clean"
            echo "result=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[info] rebase rc=$REBASE_RC — entering auto-resolve path"

          # Strip commit deleted enterprise/*; upstream still develops those.
          # Auto-resolve by keeping the deletion. Restricted to enterprise/.
          # Conflict shape during rebase: "us" = vendor/upstream (the new base,
          # has modifications); "them" = our commit being applied (which deletes).
          # So porcelain code is UD = "updated by us, deleted by them".
          echo "[debug] git status --porcelain (head):"
          git status --porcelain | head -20

          UD_FILES=$(git status --porcelain | awk '/^UD / {print $2}')
          echo "[debug] UD count: $(echo "$UD_FILES" | grep -c .)"

          if [ -z "$UD_FILES" ]; then
            echo "[fail] no UD entries; bailing"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git rebase --abort 2>/dev/null
            exit 0
          fi

          for f in $UD_FILES; do
            case "$f" in
              enterprise/*) ;;
              *) echo "[fail] non-enterprise UD: $f"
                 echo "result=conflict" >> "$GITHUB_OUTPUT"
                 git rebase --abort 2>/dev/null
                 exit 0;;
            esac
          done

          OTHER_CONFLICTS=$(git status --porcelain | awk '/^(UU|AA|DD|AU|UA) /')
          if [ -n "$OTHER_CONFLICTS" ]; then
            echo "[fail] non-UD conflict types present:"
            echo "$OTHER_CONFLICTS" | head -20
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git rebase --abort 2>/dev/null
            exit 0
          fi

          echo "[ok] all conflicts are enterprise/ UD — resolving by deletion"
          for f in $UD_FILES; do
            git rm -f -- "$f" >/dev/null
          done

          GIT_EDITOR=true git -c commit.gpgsign=false rebase --continue
          CONT_RC=$?
          if [ $CONT_RC -ne 0 ]; then
            echo "[fail] rebase --continue rc=$CONT_RC"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git rebase --abort 2>/dev/null
            exit 0
          fi

          echo "[ok] rebase auto-resolved"
          echo "result=clean" >> "$GITHUB_OUTPUT"
          echo "auto_resolved=true" >> "$GITHUB_OUTPUT"

      - name: Push & open PR on clean rebase
        if: steps.rebase.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.REBASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(git rev-list --count cognis/main..rebase-staging)
          if [ "$AHEAD" = "0" ]; then
            echo "No new upstream commits."
            exit 0
          fi
          git push origin rebase-staging --force
          # PR-creation needs either (a) org setting "Allow GitHub Actions to
          # create and approve pull requests" enabled, or (b) a REBASE_BOT_TOKEN
          # PAT. Until one is set up, GITHUB_TOKEN gets 403 here. The rebased
          # branch is pushed regardless — operators can open the PR manually
          # at the URL printed in `remote:` output.
          if ! PR_URL=$(gh pr create \
            --base cognis/main \
            --head rebase-staging \
            --title "chore: upstream rebase $(date -I)" \
            --body "Automated nightly rebase onto vendor/upstream. $AHEAD new upstream commit(s)." 2>&1); then
            echo "::warning::PR creation blocked (likely org policy). Branch is pushed; open the PR manually."
            echo "Detail: $PR_URL"
            exit 0
          fi
          echo "Created: $PR_URL"
          gh pr edit "$PR_URL" --add-label rebase-auto 2>/dev/null || true

      - name: Open issue on conflict
        if: steps.rebase.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.REBASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! ISSUE_URL=$(gh issue create \
            --title "Upstream rebase conflict $(date -I)" \
            --body "Nightly rebase onto vendor/upstream hit conflicts. Manual resolution required." 2>&1); then
            echo "::warning::Issue creation failed; check ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} for details."
            echo "Detail: $ISSUE_URL"
            exit 0
          fi
          echo "Created: $ISSUE_URL"
          gh issue edit "$ISSUE_URL" --add-label rebase-conflict 2>/dev/null || true
