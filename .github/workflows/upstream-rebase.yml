name: Upstream rebase

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: cognis/main
          # Prefer a PAT so the resulting PR push triggers downstream CI
          # (GITHUB_TOKEN-driven pushes intentionally don't). Falls back to
          # GITHUB_TOKEN so the bot still works before a PAT is configured.
          token: ${{ secrets.REBASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "cognis-rebase-bot"
          git config user.email "bot@cognisai.com"
          git config rerere.enabled true
          git config rerere.autoUpdate true

      - name: Restore rerere cache
        run: |
          mkdir -p .git/rr-cache
          if [ -d infra/rerere-cache ]; then
            cp -R infra/rerere-cache/. .git/rr-cache/
          fi

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/chatwoot/chatwoot
          git fetch upstream develop

      - name: Update vendor/upstream branch
        run: |
          git checkout -B vendor/upstream upstream/develop
          git push origin vendor/upstream --force

      - name: Try rebase (auto-resolves enterprise/ modify-delete)
        id: rebase
        run: |
          set +e
          git checkout -B rebase-staging cognis/main
          git rebase vendor/upstream
          if [ $? -eq 0 ]; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Recurring conflict shape: strip commit deleted enterprise/*; upstream
          # is still developing those files. Strip is permanent intent — keep
          # the deletion. SAFETY: restricted to enterprise/ paths only.
          UD=$(git status --porcelain | awk '/^UD / {print $2}')
          if [ -z "$UD" ]; then
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git rebase --abort 2>/dev/null
            exit 0
          fi
          for f in $UD; do
            case "$f" in
              enterprise/*) ;;
              *) echo "result=conflict (non-enterprise UD)" >> "$GITHUB_OUTPUT"
                 git rebase --abort 2>/dev/null
                 exit 0;;
            esac
          done
          if [ -n "$(git status --porcelain | awk '/^(UU|AA|DD|AU|UA|UD) /')" ]; then
            echo "result=conflict (non-UD conflicts)" >> "$GITHUB_OUTPUT"
            git rebase --abort 2>/dev/null
            exit 0
          fi
          for f in $UD; do git rm -f -- "$f" >/dev/null; done
          GIT_EDITOR=true git -c commit.gpgsign=false rebase --continue
          if [ $? -ne 0 ]; then
            echo "result=conflict (continue failed)" >> "$GITHUB_OUTPUT"
            git rebase --abort 2>/dev/null
            exit 0
          fi
          echo "result=clean" >> "$GITHUB_OUTPUT"
          echo "auto_resolved=true" >> "$GITHUB_OUTPUT"

      - name: Push & open PR on clean rebase
        if: steps.rebase.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.REBASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(git rev-list --count cognis/main..rebase-staging)
          if [ "$AHEAD" = "0" ]; then
            echo "No new upstream commits."
            exit 0
          fi
          git push origin rebase-staging --force
          gh pr create \
            --base cognis/main \
            --head rebase-staging \
            --title "chore: upstream rebase $(date -I)" \
            --body "Automated nightly rebase onto vendor/upstream. $AHEAD new upstream commit(s)." \
            --label rebase-auto

      - name: Open issue on conflict
        if: steps.rebase.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.REBASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream rebase conflict $(date -I)" \
            --label rebase-conflict \
            --body "Nightly rebase onto vendor/upstream hit conflicts. Manual resolution required."
