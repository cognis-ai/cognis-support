# #
# # Publishes the Cognis Support fork image to GHCR.
# #
# # Builds docker/Dockerfile (the fork's documented image build — same file
# # cognis-platform's `pnpm infra:build` uses for cognis/support:dev) and pushes
# # ghcr.io/cognis-ai/support tagged with the git sha + the semver tag, per the
# # deployment map (docs/plans/build/deployment-map.md §4.1). Coolify deploys
# # reference the DIGEST emitted in the job summary, never a mutable tag.
# #
# # Bases (node:24-alpine, ruby:3.4.4-alpine3.21) are tag-pinned in the
# # Dockerfile; no :latest base was flagged for this fork. DISABLE_ENTERPRISE
# # is baked into the Dockerfile (enterprise/ is stripped on cognis/main).
# #

name: Publish Cognis Support image to GHCR

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cognis-ai/support

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=
            type=raw,value=cognis-main,enable=${{ github.ref_name == 'cognis/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emit deployable digest
        run: |
          echo "### ghcr.io/${IMAGE_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployable digest (pin this in Coolify, never a tag):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
